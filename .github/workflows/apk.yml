name: APK Inventario Capiro

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "android/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Leer la versión de la app
        id: ver
        run: |
          V=$(grep -m1 'versionName' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versión de la app: $V"

      - name: Retirar versiones con el nombre antiguo
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          exec > >(tee rename.log) 2>&1
          for n in 1 2 3 4 5; do
            OLD="inventario-capiro-v0.1.$n"
            gh release view "$OLD" >/dev/null 2>&1 || continue
            gh release delete "$OLD" -y --cleanup-tag || gh release delete "$OLD" -y
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Copiar la app web dentro del APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Compilar APK firmado
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Nombrar el APK con la versión
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "inventario-capiro-${{ steps.ver.outputs.version }}.apk"

      - name: Publicar versión
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Inventario Capiro ${{ steps.ver.outputs.version }}
          body: APK de Inventario Capiro ${{ steps.ver.outputs.version }}. Instálalo en Android 8 o superior; se instala encima de la versión anterior sin perder datos.
          files: inventario-capiro-${{ steps.ver.outputs.version }}.apk
          overwrite_files: true

      - name: Dejar APK y bitácora en la rama apk
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp rename.log out/ 2>/dev/null || true
          cp android/app/build/outputs/apk/debug/app-debug.apk out/inventario-capiro.apk 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA}" > out/estado.txt
          cd out
          git init -q && git checkout -q -b apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
