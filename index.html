<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: una sola columna tipo app de bolsillo, barra inferior fija. Identidad EK: negro y crema, sin acentos de color salvo alertas */
:root{
  --bg:#f3f1eb; --surface:#fbfaf6; --ink:#0b0b0a; --muted:#6a675f; --line:#dedbd2;
  --brand:#0b0b0a; --leaf:#0b0b0a; --leaf-soft:#e6e3da;
  --warn:#8a5a0e; --warn-soft:#f6ecd8; --bad:#a3322a; --bad-soft:#f6dfdb;
  --f-display:"Archivo", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, "Roboto Mono", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0a; --surface:#161614; --ink:#ece8dd; --muted:#9b978c; --line:#2b2a26;
  --brand:#ece8dd; --leaf:#ece8dd; --leaf-soft:#24231f;
  --warn:#e0b25f; --warn-soft:#2e2615; --bad:#ec8a7e; --bad-soft:#35191a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0a; --surface:#161614; --ink:#ece8dd; --muted:#9b978c; --line:#2b2a26;
  --brand:#ece8dd; --leaf:#ece8dd; --leaf-soft:#24231f;
  --warn:#e0b25f; --warn-soft:#2e2615; --bad:#ec8a7e; --bad-soft:#35191a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;padding:0 16px 96px}
.wrap{max-width:640px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.25rem;color:var(--brand);letter-spacing:-.01em}
.logo{width:40px;height:40px;border-radius:10px;background:#0b0b0a;display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--line)}
.logo svg{width:28px;height:22px;fill:#ece8dd}
.brand small{display:block;margin-top:1px;font-family:var(--f-body);font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mode{font-size:.75rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mode.on{color:var(--leaf);border-color:var(--leaf)}
.mode.local{color:var(--warn);border-color:var(--warn)}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:20px 0 8px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1rem;margin:16px 0 6px}
.lbl{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mission{background:var(--brand);color:var(--bg);border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.mission .lbl{color:inherit;opacity:.75}
.mission b{font-family:var(--f-display);font-size:1.1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat .n{font-family:var(--f-num);font-size:1.15rem;font-variant-numeric:tabular-nums}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-top:8px}
.alert .dot{width:10px;height:10px;border-radius:50%}
.alert.bad{background:var(--bad-soft);border-color:transparent}.alert.bad .dot{background:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:transparent}.alert.warn .dot{background:var(--warn)}
.alert.ok .dot{background:var(--leaf)}
.alert .t{min-width:0}.alert .t div{font-size:.85rem;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit;width:100%}
.row:first-child{border-top:0}
.row .nm{font-weight:600;min-width:0}
.row .sub{font-size:.8rem;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf)}
.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.pill.p{background:var(--leaf-soft);color:var(--leaf)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mut{border:1px solid var(--line);color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:8px 0;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 .85rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--bg);border-color:var(--brand)}
label.f{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{border:0;border-radius:9px;padding:8px 2px;font:700 .8rem var(--f-body);background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.qty{display:grid;grid-template-columns:48px 1fr 48px;gap:6px}
.qty button{font:700 1.2rem var(--f-num)}
.btn{border:0;border-radius:12px;padding:12px 16px;font:700 1rem var(--f-body);cursor:pointer;background:var(--leaf);color:var(--bg)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:.85rem;color:var(--muted)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{border:0;background:none;color:var(--muted);font:700 .72rem var(--f-body);display:grid;justify-items:center;gap:2px;padding:4px 0;cursor:pointer}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--leaf)}
.ct{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.ct .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ct .ins{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ct .ins input{padding:8px;text-align:center;font-family:var(--f-num)}
.ct .ins label{font-size:.7rem}
.ct .res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.8rem}
.ct .res div{background:var(--bg);border-radius:8px;padding:6px;display:grid}
.ct .res b{font-family:var(--f-num);font-size:.95rem}
.neg{color:var(--bad)}.pos{color:var(--warn)}.zero{color:var(--leaf)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,6,4,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:90%}
table.rep{border-collapse:collapse;width:100%;font-size:.85rem}
table.rep th,table.rep td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.rep th:first-child,table.rep td:first-child{text-align:left;white-space:normal}
.scroll{overflow-x:auto}
.chk{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:grid;gap:4px;background:var(--surface)}
.chk label{display:flex;gap:8px;align-items:center;font-size:.9rem}
.chk input{width:auto}
.step{display:grid;grid-template-columns:40px 3ch 40px;gap:6px;align-items:center;text-align:center}
.step button{padding:6px 0;font:700 1.1rem var(--f-num)}
.guide ol{padding-left:20px;margin:6px 0}.guide li{margin:4px 0}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

/* ---------- Almacenamiento: db compartida o modo local ---------- */
const LKEY="capiro-inventario-v1";
let chain=Promise.resolve();
function enqueue(fn){chain=chain.then(fn).catch(e=>{console.error(e);toast(e&&e.code==="quota_exceeded"?"Base llena: exporta y limpia movimientos antiguos.":"No se pudo guardar. Revisa la conexión e intenta de nuevo.");});return chain;}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({prod:S.prod,days:S.days,cuadres:S.cuadres,combos:S.combos,recetas:S.recetas,provs:S.provs,alias:S.alias}));}catch(e){}}
function loadLocal(){let d=null;try{d=JSON.parse(localStorage.getItem(LKEY)||"null");}catch(e){}
  if(d){S.prod=d.prod||{};S.days=d.days||{};S.cuadres=d.cuadres||{};S.combos=d.combos||JSON.parse(JSON.stringify(COMBOS_BASE));S.recetas=d.recetas||JSON.parse(JSON.stringify(RECETAS_BASE));S.provs=d.provs||{};S.alias=d.alias||{};migrar03();if(!d.combos||!d.recetas)saveLocal();}
  else{S.prod=JSON.parse(JSON.stringify(CATALOGO));S.combos=JSON.parse(JSON.stringify(COMBOS_BASE));S.recetas=JSON.parse(JSON.stringify(RECETAS_BASE));saveLocal();S.firstRun=true;}}
function migrar03(){if(!S.prod["IN-018"])S.prod["IN-018"]=JSON.parse(JSON.stringify(CATALOGO["IN-018"]));Object.keys(S.combos).forEach(k=>{if(!S.combos[k].piezas&&COMBOS_BASE[k])S.combos[k].piezas=JSON.parse(JSON.stringify(COMBOS_BASE[k].piezas||[]));});}
const store={
  putProd(id,data){S.prod[id]=data;if(S.backend)return enqueue(()=>S.backend.collection("productos").doc(id).set(data));saveLocal();render();},
  delProd(id){delete S.prod[id];if(S.backend)return enqueue(()=>S.backend.collection("productos").doc(id).delete());saveLocal();render();},
  putDay(date,day){S.days[date]=day;if(S.backend)return enqueue(()=>S.backend.collection("dias").doc(date).set(day));saveLocal();render();},
  putAlias(map){S.alias=map;if(S.backend)return enqueue(()=>S.backend.collection("ajustes").doc("alias").set({map}));saveLocal();},
  putProv(id,data){S.provs[id]=data;if(S.backend)return enqueue(()=>S.backend.collection("proveedores").doc(id).set(data));saveLocal();render();},
  putReceta(id,data){S.recetas[id]=data;if(S.backend)return enqueue(()=>S.backend.collection("recetas").doc(id).set(data));saveLocal();render();},
  putCombo(id,data){S.combos[id]=data;if(S.backend)return enqueue(()=>S.backend.collection("combos").doc(id).set(data));saveLocal();render();},
  putCuadre(id,data){S.cuadres[id]=data;if(S.backend)return enqueue(()=>S.backend.collection("cuadres").doc(id).set(data));saveLocal();render();},
  delCuadre(id){delete S.cuadres[id];if(S.backend)return enqueue(()=>S.backend.collection("cuadres").doc(id).delete());saveLocal();render();}
};
function setMode(kind,text){const m=$("#mode");m.className="mode "+kind;m.textContent=text;}
function snapToMap(snap){const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});return o;}
async function connect(){
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null;}catch(e){db=null;}
  if(!db){loadLocal();setMode("local",window.AndroidApp?"En este teléfono":"Solo este navegador");S.ready=true;render();if(S.firstRun)toast("Catálogo del libro maestro cargado: 91 productos");return;}
  S.backend=db;setMode("on","Sincronizado");
  try{const u=window.claude&&window.claude.use?await window.claude.use("user"):null;if(u){const c=await u.can("data.write");if(c===false)S.canWrite=false;}}catch(e){}
  const loaded={p:false,d:false,c:false,k:false,r:false,v:false,a:false};
  const onErr=e=>{setMode("local","Sin conexión");console.error(e);};
  db.collection("productos").onSnapshot(s=>{S.prod=snapToMap(s);loaded.p=true;maybe();},onErr);
  db.collection("dias").onSnapshot(s=>{S.days=snapToMap(s);loaded.d=true;maybe();},onErr);
  db.collection("cuadres").onSnapshot(s=>{S.cuadres=snapToMap(s);loaded.c=true;maybe();},onErr);
  db.collection("ajustes").onSnapshot(s=>{const m=snapToMap(s);S.alias=(m.alias&&m.alias.map)||{};loaded.a=true;maybe();},onErr);
  db.collection("proveedores").onSnapshot(s=>{S.provs=snapToMap(s);loaded.v=true;maybe();},onErr);
  db.collection("recetas").onSnapshot(s=>{S.recetas=snapToMap(s);loaded.r=true;maybe();},onErr);
  db.collection("combos").onSnapshot(s=>{S.combos=snapToMap(s);loaded.k=true;maybe();},onErr);
  function maybe(){if(loaded.p&&loaded.d&&loaded.c&&loaded.k&&loaded.r&&loaded.v&&loaded.a){S.ready=true;softRender();}}
}
function softRender(){const a=document.activeElement;if(a&&$("#main").contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)){S.pendingRender=true;return;}render();}
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.pendingRender){S.pendingRender=false;softRender();}},150));

function saveDay(date,patch){store.putDay(date,Object.assign({items:[]},S.days[date]||{},patch));}
/* ---------- Cálculos ---------- */
function allMovs(){const out=[];Object.keys(S.days).forEach(k=>{(S.days[k].items||[]).forEach(m=>out.push(Object.assign({day:k},m)));});return out.sort((a,b)=>a.ts-b.ts);}
function cuadreList(){return Object.keys(S.cuadres).map(id=>Object.assign({id},S.cuadres[id])).sort((a,b)=>b.ts-a.ts);}
function lastCount(pid){for(const c of cuadreList()){const r=(c.filas||[]).find(f=>f.p===pid&&f.fisico!==null&&f.fisico!==undefined&&f.fisico!=="");if(r)return{ts:c.ts,fisico:Number(r.fisico),id:c.id};}return null;}
function sign(m){const q=Number(m.q)||0;if(m.t==="entrada")return q;if(m.t==="ajuste")return q;return -q;}
function flow(pid,movs){const lc=lastCount(pid);const since=lc?lc.ts:0;const f={base:lc?lc.fisico:0,since,counted:!!lc,ent:0,merma:0,consumo:0,venta:0,ajuste:0};
  for(const m of movs){if(m.p!==pid||m.ts<=since)continue;const q=Number(m.q)||0;if(m.t==="entrada")f.ent+=q;else if(m.t==="merma")f.merma+=q;else if(m.t==="consumo")f.consumo+=q;else if(m.t==="venta")f.venta+=q;else if(m.t==="ajuste")f.ajuste+=q;}
  f.stock=f.base+f.ent+f.ajuste-f.merma-f.consumo-f.venta;return f;}
function lots(pid,movs,stock){const ent=movs.filter(m=>m.p===pid&&m.t==="entrada").sort((a,b)=>{const av=a.vence||"9999",bv=b.vence||"9999";return av<bv?1:av>bv?-1:b.ts-a.ts;});
  let rem=Math.max(0,stock);const out=[];for(const e of ent){if(rem<=0)break;const take=Math.min(rem,Number(e.q)||0);rem-=take;out.push({lote:e.lote,vence:e.vence,q:take,ts:e.ts});}
  return out.sort((a,b)=>(a.vence||"9999")<(b.vence||"9999")?-1:1);}
function computeAll(){const movs=allMovs();const res={};Object.keys(S.prod).forEach(id=>{const p=S.prod[id];if(p.activo===false)return;const f=flow(id,movs);f.lots=p.per?lots(id,movs,f.stock):[];res[id]=f;});return{movs,res};}

function calcRow(f,d){const fis=d.fisico===undefined||d.fisico===""?null:Number(d.fisico);

  const ls=d.lstock===undefined||d.lstock===""?null:Number(d.lstock);
  return{fis,salio,difV:(salio!==null&&lv!==null)?salio-lv:null,difS:(fis!==null&&ls!==null)?ls-fis:null,difApp:fis!==null&&f.counted?fis-f.stock:null};}

function resCells(id,f,d){const r=calcRow(f,d);const v=n=>n===null?"—":(n>0?"+":"")+fmt(n);

const addDays=(iso,n)=>{const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
function comboList(){return Object.keys(S.combos).map(id=>Object.assign({id},S.combos[id])).sort((a,b)=>((b.activo?1:0)-(a.activo?1:0))||((a.orden||99)-(b.orden||99))||String(a.nombre).localeCompare(String(b.nombre)));}
function rangeStats(c,a,b){let v=0,m=0,tv=0,tc=0;
  for(let d=a;d<=b;d=addDays(d,1)){const day=S.days[d];if(!day)continue;
    v+=Number((day.combos||{})[c.id])||0;
    if(Number(day.tc)>0){tv+=Number(day.tv)||0;tc+=Number(day.tc)||0;}
    (day.items||[]).forEach(x=>{if(x.t==="merma"&&(c.rot||[]).includes(x.p))m+=(Number(x.q)||0)*(Number((S.prod[x.p]||{}).costo)||0);});}
  return{v,m,t:tc?tv/tc:null};}
function ficha(c){if(!c.inicio)return null;const hoy=today();
  const auto=rangeStats(c,addDays(c.inicio,-7),addDays(c.inicio,-1));const b=c.base||{};const has=k=>b[k]!==null&&b[k]!==undefined&&b[k]!=="";
  const B={v:has("v")?Number(b.v):auto.v,m:has("m")?Number(b.m):auto.m,t:has("t")?Number(b.t):auto.t};
  const weeks=[];for(let w=0;w<4;w++){const a=addDays(c.inicio,7*w),e=addDays(a,6);if(a>hoy)break;const st=rangeStats(c,a,e<hoy?e:hoy);st.parcial=e>=hoy;st.a=a;st.e=e;st.n=w+1;weeks.push(st);}
  const full=weeks.filter(w=>!w.parcial);let wins=0,crit=0,av=null,am=null,at=null;
  if(full.length){const avg=k=>{const vals=full.map(w=>w[k]).filter(x=>x!==null);return vals.length?vals.reduce((p,q)=>p+q,0)/vals.length:null;};
    av=avg("v");am=avg("m");at=avg("t");
    crit++;if(av>B.v)wins++;
    crit++;if(am<B.m)wins++;
    if(at!==null&&B.t!==null){crit++;if(at>B.t)wins++;}}
  const done=full.length>=4;const dec=!full.length?null:wins>=2?"Mantener":wins===1?"Ajustar":"Retirar";
  return{B,weeks,full,wins,crit,done,dec,av,am,at};}

const REVENTA=["Lácteos y refrigerados","Cervezas","Hojaldres y panadería","Tortas","Bebidas envasadas","Vinos","Café empacado"];
function stockSeg(){return stockSeg3();}
function baseDe(pid){for(const k in S.recetas){const r=S.recetas[k];if(r.tipo==="base"&&r.produce===pid)return Object.assign({id:k},r);}return null;}
function costoProd(pid,depth){depth=depth||0;const b=depth<3?baseDe(pid):null;
  if(b){const r=costoReceta(b,depth+1);const rinde=Number(b.rinde)||0;return{c:rinde?r.c/rinde:0,faltan:r.faltan};}
  const c=Number((S.prod[pid]||{}).costo)||0;return{c,faltan:c>0?[]:[pid]};}
function costoReceta(r,depth){let c=0;const faltan=[];(r.ing||[]).forEach(i=>{const x=costoProd(i.p,depth);c+=x.c*(Number(i.q)||0);x.faltan.forEach(f=>{if(!faltan.includes(f))faltan.push(f);});});return{c,faltan};}
function pieza(id){if(S.recetas[id]){const r=S.recetas[id];const x=costoReceta(r);return{nombre:r.nombre,c:x.c,precio:Number(r.precio)||0,faltan:x.faltan};}
  const p=S.prod[id]||{};const x=costoProd(id);return{nombre:p.nombre||id,c:x.c,precio:Number(p.precio)||0,faltan:x.faltan};}
function costoCombo(c){let costo=0,suma=0;const faltan=[];let sinPrecio=0;(c.piezas||[]).forEach(pz=>{const x=pieza(pz.id);const q=Number(pz.q)||1;costo+=x.c*q;suma+=x.precio*q;if(!x.precio)sinPrecio++;x.faltan.forEach(f=>{if(!faltan.includes(f))faltan.push(f);});});
  return{c:costo,suma,sugerido:Math.round(suma*0.9/500)*500,faltan,sinPrecio};}
function pctPill(costo,precio,faltan){if(faltan&&faltan.length)return'<span class="pill mut">Faltan costos</span>';if(!(precio>0))return'<span class="pill mut">Sin precio</span>';const p=costo/precio*100;const cls=p<=30?"p":p<=35?"warn":"bad";return'<span class="pill '+cls+'">'+Math.round(p)+' %</span>';}
function vCostos(){const mode=S.cmode||"bebidas";

  const prom=conPrecio.length?conPrecio.reduce((s,r)=>s+r.c/Number(r.precio),0)/conPrecio.length*100:null;
  const faltaCount={};beb.forEach(r=>r.faltan.forEach(f=>{faltaCount[f]=(faltaCount[f]||0)+1;}));

  h+='<div class="chips">'+[["bebidas","Bebidas y postres"],["reventa","Reventa"],["combos","Combos"],["bases","Preparaciones base"]].map(([k,l])=>'<button class="chip" data-cmode="'+k+'" aria-pressed="'+(mode===k)+'">'+l+'</button>').join("")+'</div>';

  if(mode==="reventa"){const ids=Object.keys(S.prod).filter(k=>S.prod[k].activo!==false&&REVENTA.includes(S.prod[k].cat)).sort((a,b)=>a.localeCompare(b));

  if(mode==="combos"){const cs=comboList();

      const sub=(c.piezas||[]).length?((pr?"precio "+cop(pr):"sin precio")+(x.sinPrecio?" · faltan precios de piezas":" · sugerido "+cop(x.sugerido)+(x.sugerido?" ("+Math.round(x.c/x.sugerido*100)+" %)":""))):"sin piezas definidas";
      return fila("data-cbedit",c.id,c.nombre,esc(sub),x.c,pr,x.faltan);}).join("")+'</div>';}
  if(mode==="bases"){const bs=rec.filter(r=>r.tipo==="base");
    h+='<p class="hint">Las preparaciones base calculan solas el costo por unidad del insumo que producen (por ejemplo, el almíbar por ml). Ajusta el rendimiento con una medición real.</p><div class="list">'+bs.map(r=>{const x=costoReceta(r);const rinde=Number(r.rinde)||0;const unit=(S.prod[r.produce]||{}).unidad||"";
      return fila("data-rec",r.id,r.nombre,"produce "+esc(prodName(r.produce))+" · rinde "+fmt(rinde)+" "+esc(unit)+" · "+(rinde&&!x.faltan.length?cop(x.c/rinde*(unit==="ml"?100:1))+(unit==="ml"?" por 100 ml":" por "+esc(unit)):"falta costo"),x.c,0,x.faltan);}).join("")+'</div>';}
  return h;}

function exportCostos(){const rows=[["Tipo","Código","Nombre","Costo ($)","Precio ($)","Margen ($)","Costo %","Insumos sin costo"]];
  Object.keys(S.recetas).sort().forEach(k=>{const r=S.recetas[k];if(r.tipo==="base")return;const x=costoReceta(r);const pr=Number(r.precio)||0;rows.push(["Receta",k,r.nombre,Math.round(x.c),pr,pr?Math.round(pr-x.c):"",pr?Math.round(x.c/pr*100):"",x.faltan.map(prodName).join("; ")]);});
  Object.keys(S.prod).filter(k=>REVENTA.includes(S.prod[k].cat)&&S.prod[k].activo!==false).sort().forEach(k=>{const p=S.prod[k];const c=Number(p.costo)||0,pr=Number(p.precio)||0;rows.push(["Reventa",k,p.nombre,c,pr,pr?pr-c:"",pr&&c?Math.round(c/pr*100):"",c?"":p.nombre]);});

  exportCSV("costos-margen-"+today()+".csv",rows);}

/* ---------- Pedido inteligente (versión 0.4) ---------- */
function esInicial(x){return x.inicial===true||(x.inicial===undefined&&Number(x.esperado)===0&&typeof x.salio==="number"&&typeof x.fisico==="number"&&Math.abs(x.salio+x.fisico)<1e-9);}
function normFila(x){if(!esInicial(x))return x;return Object.assign({},x,{salio:null,difV:null,difApp:null});}
function diagnostico(filas){const rs=filas.map(normFila).filter(x=>typeof x.difS==="number");
  const ok=rs.filter(x=>Math.abs(x.difS)<1e-9),mas=rs.filter(x=>x.difS>0),sinCtl=rs.filter(x=>x.difS<0&&Number(x.lstock)===0&&Number(x.fisico)>0),menos=rs.filter(x=>x.difS<0&&!(Number(x.lstock)===0));
  const cruces=[];const usados=new Set();
  const elig=x=>Math.abs(x.difS)>=5&&Number(x.lstock)>0;rs.forEach(a=>{if(usados.has(a.p)||!elig(a))return;const ca=(S.prod[a.p]||{}).cat;const b=rs.find(b=>b.p!==a.p&&!usados.has(b.p)&&elig(b)&&(S.prod[b.p]||{}).cat===ca&&Math.abs(a.difS+b.difS)<1e-9);if(b){usados.add(a.p);usados.add(b.p);cruces.push([a,b]);}});
  return{total:rs.length,ok,mas,menos,sinCtl,cruces};}
function diagHtml(dg){if(!dg.total)return'';const n=x=>esc(prodName(x.p));const lista=(arr,f)=>arr.slice().sort((a,b)=>Math.abs(b.difS)-Math.abs(a.difS)).slice(0,8).map(f).join(", ")+(arr.length>8?"…":"");
  let h='<h3>Diagnóstico frente a Loggro</h3><p class="hint">'+dg.ok.length+' de '+dg.total+' productos cuadran exacto ('+Math.round(dg.ok.length/dg.total*100)+' %).</p>';
  if(dg.cruces.length)h+='<div class="alert bad"><span class="dot"></span><div class="t"><b>Posible cruce de códigos</b><div>'+dg.cruces.map(([a,b])=>n(a)+' '+(a.difS>0?"+":"")+fmt(a.difS)+' y '+n(b)+' '+(b.difS>0?"+":"")+fmt(b.difS)).join(" · ")+'. Diferencias iguales y opuestas: se vende uno y se registra el otro.</div></div></div>';
  const mas=dg.mas.filter(x=>!dg.cruces.some(c=>c.includes(x)));const menos=dg.menos.filter(x=>!dg.cruces.some(c=>c.includes(x)));
  if(mas.length)h+='<div class="alert bad"><span class="dot"></span><div class="t"><b>Loggro cree que hay más ('+mas.length+' productos, '+fmt(mas.reduce((s,x)=>s+x.difS,0))+' und)</b><div>Posibles ventas sin registrar, mermas sin descargar o faltantes: '+lista(mas,x=>n(x)+' +'+fmt(x.difS))+'.</div></div></div>';
  if(menos.length)h+='<div class="alert warn"><span class="dot"></span><div class="t"><b>Loggro cree que hay menos ('+menos.length+' productos, '+fmt(menos.reduce((s,x)=>s+x.difS,0))+' und)</b><div>Compras sin cargar en Loggro o descuentos dobles por receta: '+lista(menos,x=>n(x)+' '+fmt(x.difS))+'.</div></div></div>';
  if(dg.sinCtl.length)h+='<div class="alert warn"><span class="dot"></span><div class="t"><b>Sin inventario en Loggro ('+dg.sinCtl.length+' productos, '+fmt(dg.sinCtl.reduce((s,x)=>s+Number(x.fisico),0))+' und en físico)</b><div>Loggro marca 0 pero hay producto: no se le cargan las compras o no tiene control de inventario. '+lista(dg.sinCtl,x=>n(x)+' '+fmt(x.fisico))+'.</div></div></div>';
  return h;}
function conteos(pid){const out=[];cuadreList().forEach(c=>{const r=(c.filas||[]).find(f=>f.p===pid&&f.fisico!==null&&f.fisico!==undefined&&f.fisico!=="");if(r)out.push({ts:c.ts,f:Number(r.fisico)});});return out.sort((a,b)=>a.ts-b.ts);}
function demanda(pid,movs){const cs=conteos(pid);const desde=Date.now()-28*864e5;let sal=0,dias=0,pares=0;
  for(let i=1;i<cs.length;i++){const a=cs[i-1],b=cs[i];if(b.ts<desde)continue;const d=(b.ts-a.ts)/864e5;if(d<0.5)continue;
    let ent=0;movs.forEach(m=>{if(m.p===pid&&m.ts>a.ts&&m.ts<=b.ts&&(m.t==="entrada"||m.t==="ajuste"))ent+=Number(m.q)||0;});
    sal+=a.f+ent-b.f;dias+=d;pares++;}
  return dias>=3?{dia:Math.max(0,sal/dias),dias:Math.round(dias),pares}:null;}
function provDe(p){return p&&p.prov&&S.provs[p.prov]?Object.assign({id:p.prov},S.provs[p.prov]):null;}
function cobertura(){return Number(S.cob)||7;}
function planPedido(){const {res,movs}=computeAll();const items=[];
  Object.keys(res).forEach(id=>{const p=S.prod[id],f=res[id];const pv=provDe(p);const ent=pv&&Number(pv.entrega)>=0?Number(pv.entrega):2;
    const dm=demanda(id,movs);const minS=dm?Math.ceil(dm.dia*(ent+1)):null,idealS=dm?Math.ceil(dm.dia*(cobertura()+ent)):null;
    const target=idealS!==null?idealS:(Number(p.ideal)||0);const caja=Math.max(1,Number(p.caja)||1);
    let pedir=Math.max(0,target-Math.max(0,f.stock));if(pedir>0)pedir=Math.ceil(pedir/caja)*caja;
    const ov=S.pedEdit[id];if(ov!==undefined&&ov!=="")pedir=Math.max(0,Number(ov)||0);
    items.push({id,p,f,dm,minS,idealS,target,pedir,caja,pv,ent});});
  return items;}
function stockSeg3(){return'<div class="seg" style="grid-template-columns:repeat(3,1fr);margin-top:16px" role="group" aria-label="Vista">'+[["exist","Existencias"],["costos","Costos"],["pedido","Pedido"]].map(([k,l])=>'<button type="button" data-smode="'+k+'" aria-pressed="'+((S.smode||"exist")===k)+'">'+l+'</button>').join("")+'</div>';}

  const agotHoy=items.filter(x=>Number(x.p.prio)>0&&x.f.counted&&x.f.stock<=0).length;

  h+='<div class="form" style="margin-top:12px"><div class="grid2"><label class="f" for="pdCob">Cubrir días<input id="pdCob" type="number" inputmode="numeric" value="'+cobertura()+'"></label><div style="display:flex;align-items:end"><button class="btn sec" id="pdProv" style="width:100%">Proveedores ('+Object.keys(S.provs).length+')</button></div></div><p class="hint">Con 2 conteos o más separados por 3 días, la app calcula la salida real por día y pide para cubrir esos días más el tiempo de entrega del proveedor. Sin datos usa el ideal que configuraste.</p></div>';
  if(ped.length)h+='<div class="btns" style="margin-top:12px"><button class="btn" id="pdPdf">Enviar PDF a la jefa</button><button class="btn sec" id="pdPdfSave">Guardar PDF</button></div><p class="hint">El PDF agrupa las líneas por proveedor, marca agotados y bajo mínimo, suma el costo estimado y deja espacio para aprobar. Ajusta las cantidades abajo antes de generarlo.</p>';

function filasImport(){const I=S.imp,m=I.map;const out=[];I.rows.slice(m.hi+1).forEach(r=>{const nombre=m.nombre>=0?String(r[m.nombre]||"").trim():"";const q=parseNum(m.tipo==="lstock"?r[m.stock]:r[m.cant]);
  if(!nombre||q===null)return;if(/^(total|subtotal|totales)\b/.test(normTxt(nombre)))return;const k=normTxt(nombre);const em=I.man[k]!==undefined?{p:I.man[k],por:I.man[k]?"elegido":""}:emparejar(nombre,m.codigo>=0?r[m.codigo]:"");out.push({nombre,k,q,p:em.p,por:em.por});});return out;}
function mapImport(){const I=S.imp,m=I.map,head=I.rows[m.hi]||[];
  const opt=(sel)=>'<option value="-1">—</option>'+head.map((h,i)=>'<option value="'+i+'"'+(i===sel?" selected":"")+'>'+esc(h||("Columna "+(i+1)))+'</option>').join("");
  const fs=filasImport();const agg={};fs.forEach(x=>{if(x.p)agg[x.p]=(agg[x.p]||0)+x.q;});const sin=fs.filter(x=>!x.p);
  const prods=Object.keys(S.prod).filter(k=>S.prod[k].activo!==false).sort((a,b)=>S.prod[a].nombre.localeCompare(S.prod[b].nombre));
  const popt=sel=>'<option value="">No está en la app (ignorar)</option>'+prods.map(k=>'<option value="'+esc(k)+'"'+(k===sel?" selected":"")+'>'+esc(S.prod[k].nombre)+'</option>').join("");
  openSheet('<h2>Revisar importación</h2><p class="hint">'+esc(I.name)+' · '+fs.length+' filas con cantidad · encabezados en la fila '+(m.hi+1)+'</p><div class="form">'+
    '<div class="seg" style="grid-template-columns:1fr 1fr" role="group" aria-label="Tipo de reporte"><button type="button" data-imt="lventas" aria-pressed="'+(m.tipo==="lventas")+'">Ventas Loggro</button><button type="button" data-imt="lstock" aria-pressed="'+(m.tipo==="lstock")+'">Stock Loggro</button></div>'+
    '<div class="grid2"><label class="f" for="imN">Columna de producto<select id="imN">'+opt(m.nombre)+'</select></label><label class="f" for="imQ">Columna de '+(m.tipo==="lstock"?"existencia":"cantidad")+'<select id="imQ">'+opt(m.tipo==="lstock"?m.stock:m.cant)+'</select></label></div>'+
    '<label class="f" for="imC">Columna de código (opcional)<select id="imC">'+opt(m.codigo)+'</select></label></div>'+
    '<div class="stats"><div class="stat"><div class="lbl">Emparejadas</div><div class="n">'+(fs.length-sin.length)+'</div></div><div class="stat"><div class="lbl">Sin emparejar</div><div class="n">'+sin.length+'</div></div><div class="stat"><div class="lbl">Productos</div><div class="n">'+Object.keys(agg).length+'</div></div></div>'+
    (fs.length?'<h3>Revisa el emparejamiento</h3><div class="list">'+fs.slice().sort((a,b)=>(a.p?1:0)-(b.p?1:0)||(a.por==="parecido"?0:1)-(b.por==="parecido"?0:1)).map(x=>'<div class="row" style="cursor:default;grid-template-columns:1fr;gap:4px"><div class="sub"><b style="color:var(--ink)">'+esc(x.nombre)+'</b> · '+fmt(x.q)+(x.por?' · por '+x.por:'')+'</div><select data-imk="'+esc(x.k)+'" aria-label="Producto de la app">'+popt(x.p)+'</select></div>').join("")+'</div>':'<div class="empty">No encontré filas con producto y cantidad. Cambia las columnas arriba.</div>')+
    '<div class="btns" style="margin-top:12px"><button class="btn" id="imOk"'+(Object.keys(agg).length?"":" disabled")+'>Llenar cuadre con '+Object.keys(agg).length+' productos</button><button class="btn sec" id="imBack">Elegir otro archivo</button></div>');
  document.querySelectorAll("[data-imt]").forEach(b=>b.onclick=()=>{m.tipo=b.dataset.imt;if(m.tipo==="lstock"&&m.stock<0)m.stock=m.cant;if(m.tipo==="lventas"&&m.cant<0)m.cant=m.stock;mapImport();});
  $("#imN").onchange=e=>{m.nombre=Number(e.target.value);mapImport();};$("#imC").onchange=e=>{m.codigo=Number(e.target.value);mapImport();};
  $("#imQ").onchange=e=>{const v=Number(e.target.value);if(m.tipo==="lstock")m.stock=v;else m.cant=v;mapImport();};
  document.querySelectorAll("[data-imk]").forEach(s=>s.onchange=()=>{I.man[s.dataset.imk]=s.value;mapImport();});
  $("#imBack").onclick=abrirImport;
  $("#imOk").onclick=()=>{const fs2=filasImport();const tot={};fs2.forEach(x=>{if(x.p)tot[x.p]=(tot[x.p]||0)+x.q;});
    Object.keys(tot).forEach(p=>{S.draft[p]=S.draft[p]||{};S.draft[p][m.tipo]=String(Math.round(tot[p]*100)/100);});
    const nuevos=Object.assign({},S.alias);let cambio=false;fs2.forEach(x=>{if(x.p&&(x.por==="elegido"||x.por==="parecido")&&nuevos[x.k]!==x.p){nuevos[x.k]=x.p;cambio=true;}});
    if(cambio)store.putAlias(nuevos);S.impInfo={n:Object.keys(tot).length,tipo:m.tipo,name:I.name};S.imp=null;closeSheet();S.view="cuadre";
    const cats=Object.keys(tot).map(p=>(S.prod[p]||{}).cat);if(cats.length&&!cats.includes(S.ccat))S.ccat=cats[0];render();toast((m.tipo==="lstock"?"Stock":"Ventas")+" de Loggro cargado en "+Object.keys(tot).length+" productos");};}

/* ---------- Hojas ---------- */
function closeSheet(){$("#sheet").innerHTML="";}
function openSheet(html){$("#sheet").innerHTML='<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
  $("#sbg").addEventListener("click",e=>{if(e.target.id==="sbg")closeSheet();});}
function editProduct(id){
  const p=id?S.prod[id]:{nombre:"",cat:S.cat!=="Todas"?S.cat:CATS[0],unidad:"und",min:0,ideal:0,costo:0,ubic:"",prio:0,per:true,activo:true};
  openSheet('<h2>'+(id?"Editar producto":"Nuevo producto")+'</h2><form id="pForm" class="form">'+
    '<div class="grid2"><label class="f" for="pId">Código<input id="pId" value="'+esc(id||"")+'" '+(id?"readonly":"")+' placeholder="L-016" required></label><label class="f" for="pUn">Unidad<input id="pUn" value="'+esc(p.unidad)+'" placeholder="und, g, ml, botella"></label></div>'+
    '<label class="f" for="pNom">Nombre<input id="pNom" value="'+esc(p.nombre)+'" required></label>'+
    '<label class="f" for="pCat">Categoría<select id="pCat">'+CATS.map(c=>'<option'+(p.cat===c?" selected":"")+'>'+esc(c)+'</option>').join("")+'</select></label>'+
    '<div class="grid2"><label class="f" for="pMin">Stock mínimo<input id="pMin" type="number" inputmode="decimal" step="any" value="'+esc(p.min)+'"></label><label class="f" for="pIdeal">Stock ideal<input id="pIdeal" type="number" inputmode="decimal" step="any" value="'+esc(p.ideal)+'"></label></div>'+
    '<div class="grid2"><label class="f" for="pCosto">Costo unitario<input id="pCosto" type="number" inputmode="decimal" value="'+esc(p.costo)+'"></label><label class="f" for="pPrecio">Precio de venta<input id="pPrecio" type="number" inputmode="decimal" value="'+esc(p.precio||"")+'" placeholder="Si se vende tal cual"></label></div>'+
    '<label class="f" for="pUbic">Ubicación<input id="pUbic" value="'+esc(p.ubic||"")+'" placeholder="Nevera, vitrina, bodega"></label>'+
    '<div class="grid2"><label class="f" for="pProv">Proveedor<select id="pProv"><option value="">Sin asignar</option>'+Object.keys(S.provs).sort((a,b)=>String(S.provs[a].nombre).localeCompare(S.provs[b].nombre)).map(k=>'<option value="'+esc(k)+'"'+(p.prov===k?" selected":"")+'>'+esc(S.provs[k].nombre)+'</option>').join("")+'</select></label><label class="f" for="pCaja">Unidades por caja<input id="pCaja" type="number" inputmode="numeric" value="'+esc(p.caja||1)+'"></label></div>'+
    '<div class="grid2"><label class="f" for="pPrio">Prioridad de rotación<select id="pPrio"><option value="0">Ninguna</option>'+[1,2,3,4].map(n=>'<option value="'+n+'"'+(Number(p.prio)===n?" selected":"")+'>'+PRIO[n]+'</option>').join("")+'</select></label><label class="f" for="pPer">Perecedero<select id="pPer"><option value="1"'+(p.per?" selected":"")+'>Sí, controlar vencimiento</option><option value="0"'+(!p.per?" selected":"")+'>No</option></select></label></div>'+
    '<div class="btns"><button class="btn" type="submit">Guardar</button><button class="btn sec" type="button" id="pCancel">Cancelar</button>'+(id?'<button class="btn danger" type="button" id="pDel">Archivar</button>':'')+'</div><div id="pConfirm"></div></form>');
  $("#pCancel").onclick=closeSheet;
  if(id)$("#pDel").onclick=()=>{$("#pConfirm").innerHTML='<p class="hint">El producto deja de aparecer, pero su historial se conserva.</p><button class="btn danger" type="button" id="pDelOk">Sí, archivar</button>';$("#pDelOk").onclick=()=>{store.putProd(id,Object.assign({},p,{activo:false}));closeSheet();toast("Producto archivado");};};
  $("#pForm").addEventListener("submit",e=>{e.preventDefault();const code=$("#pId").value.trim().toUpperCase().replace(/[^A-Z0-9_\-.]/g,"");const nom=$("#pNom").value.trim();
    if(!code||!nom){toast("Código y nombre son obligatorios.");return;}
    if(!id&&S.prod[code]&&S.prod[code].activo!==false){toast("Ese código ya existe.");return;}
    store.putProd(code,{nombre:nom,cat:$("#pCat").value,unidad:$("#pUn").value.trim()||"und",min:Number($("#pMin").value)||0,ideal:Number($("#pIdeal").value)||0,costo:Number($("#pCosto").value)||0,precio:Number($("#pPrecio").value)||0,prov:$("#pProv").value,caja:Math.max(1,Number($("#pCaja").value)||1),ubic:$("#pUbic").value.trim(),prio:Number($("#pPrio").value)||0,per:$("#pPer").value==="1",activo:true});
    closeSheet();toast("Producto guardado");});
}
function showCuadre(id){const c=S.cuadres[id];if(!c)return;const r=cuadreSummary(c);
  const rows=(c.filas||[]).map(normFila).sort((a,b)=>Math.abs(b.difV??b.difS??0)-Math.abs(a.difV??a.difS??0));const ini=rows.length&&rows.every(x=>x.salio==null);
  openSheet('<h2>Cuadre '+ftime(c.ts)+'</h2><p class="hint">'+esc(c.nota||"")+'</p><div class="stats"><div class="stat"><div class="lbl">Productos</div><div class="n">'+rows.length+'</div></div><div class="stat"><div class="lbl">Ventas sin registrar</div><div class="n">'+fmt(r.faltVentas)+'</div></div><div class="stat"><div class="lbl">Dif. valorizada</div><div class="n">'+cop(r.valor)+'</div></div></div>'+
  (ini?'<p class="hint">Conteo inicial: fija el punto de partida. «Salió» y «Ventas sin registrar» aparecen desde el siguiente cuadre; el error de stock de Loggro ya es comparable.</p>':'')+diagHtml(diagnostico(c.filas||[]))+
  '<div class="scroll" style="margin-top:12px"><table class="rep"><thead><tr><th>Producto</th><th>Esperado</th><th>Físico</th><th>Salió</th><th>Ventas Loggro</th><th>Sin registrar</th><th>Stock Loggro</th><th>Error Loggro</th></tr></thead><tbody>'+
  rows.map(x=>'<tr><td>'+esc(prodName(x.p))+'</td><td class="num">'+fmt(x.esperado)+'</td><td class="num">'+fmt(x.fisico)+'</td><td class="num">'+(x.salio==null?"—":fmt(x.salio))+'</td><td class="num">'+(x.lventas==null?"—":fmt(x.lventas))+'</td><td class="num '+cls(x.difV??null)+'">'+(x.difV==null?"—":fmt(x.difV))+'</td><td class="num">'+(x.lstock==null?"—":fmt(x.lstock))+'</td><td class="num '+cls(x.difS??null)+'">'+(x.difS==null?"—":fmt(x.difS))+'</td></tr>').join("")+
  '</tbody></table></div><div class="btns" style="margin-top:12px"><button class="btn" id="cExp">Exportar Excel</button><button class="btn sec" id="cClose">Cerrar</button><button class="btn danger" id="cDel">Borrar</button></div><div id="cConf"></div>');
  $("#cClose").onclick=closeSheet;
  $("#cExp").onclick=()=>reporteCuadre(id);
  $("#cDel").onclick=()=>{$("#cConf").innerHTML='<p class="hint">Borrar este cuadre cambia el punto de partida de sus productos.</p><button class="btn danger" id="cDelOk">Sí, borrar</button>';$("#cDelOk").onclick=()=>{store.delCuadre(id);closeSheet();toast("Cuadre borrado");};};
}
function exportCSV(name,rows){const csv="\ufeff"+rows.map(r=>r.map(v=>{v=v==null?"":String(v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\n");return saveFile(name,csv,"text/csv");}
async function saveFile(name,text,mime){
  if(window.AndroidApp&&window.AndroidApp.saveFile){try{const r=window.AndroidApp.saveFile(name,text,mime);if(r==="ok"){toast("Guardado en Descargas: "+name);return;}}catch(e){}}
  try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;if(dl){await dl.save({filename:name,data:text});toast("Archivo listo");return;}}catch(e){if(e&&e.code==="declined")return;}
  openSheet('<h2>Copiar contenido</h2><p class="hint">No se pudo guardar el archivo aquí. Copia el texto y guárdalo o pégalo en una hoja de cálculo.</p><textarea id="csvT" rows="10" readonly>'+esc(text.replace(/^\ufeff/,""))+'</textarea><div class="btns" style="margin-top:8px"><button class="btn" id="csvC">Copiar</button><button class="btn sec" id="csvX">Cerrar</button></div>');
  $("#csvX").onclick=closeSheet;$("#csvC").onclick=()=>{const t=$("#csvT");navigator.clipboard.writeText(t.value).then(()=>toast("Copiado")).catch(()=>{t.select();toast("Texto seleccionado: cópialo");});};
}

function openRestore(){
  openSheet('<h2>Restaurar copia</h2><p class="hint">Elige el archivo de respaldo o pega su contenido. Reemplaza todo lo que hay ahora en esta app.</p><div class="form"><label class="f" for="rkFile">Archivo .json<input id="rkFile" type="file" accept=".json,application/json"></label><label class="f" for="rkTxt">O pega el contenido<textarea id="rkTxt" rows="5"></textarea></label><div class="btns"><button class="btn" id="rkGo">Revisar copia</button><button class="btn sec" id="rkX">Cancelar</button></div><div id="rkMsg"></div></div>');
  $("#rkX").onclick=closeSheet;
  $("#rkFile").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("#rkTxt").value=r.result;};r.readAsText(f);};
  $("#rkGo").onclick=()=>{let d;try{d=JSON.parse($("#rkTxt").value);}catch(e){$("#rkMsg").innerHTML='<p class="hint neg">El contenido no es una copia válida.</p>';return;}
    if(!d||d.app!=="inventario-capiro"){$("#rkMsg").innerHTML='<p class="hint neg">Este archivo no es una copia de Inventario Capiro.</p>';return;}
    const np=Object.keys(d.prod||{}).length,nd=Object.keys(d.days||{}).length,nc=Object.keys(d.cuadres||{}).length;
    $("#rkMsg").innerHTML='<p class="hint">Copia del '+esc(String(d.fecha||"").slice(0,10))+': '+np+' productos, '+nd+' días con movimientos, '+nc+' cuadres.</p><button class="btn danger" id="rkOk">Reemplazar mis datos</button>';
    $("#rkOk").onclick=()=>{
      if(S.backend){Object.keys(d.prod||{}).forEach(k=>store.putProd(k,d.prod[k]));Object.keys(d.days||{}).forEach(k=>store.putDay(k,d.days[k]||{items:[]}));Object.keys(d.combos||{}).forEach(k=>store.putCombo(k,d.combos[k]));Object.keys(d.recetas||{}).forEach(k=>store.putReceta(k,d.recetas[k]));Object.keys(d.provs||{}).forEach(k=>store.putProv(k,d.provs[k]));if(d.alias)store.putAlias(d.alias);Object.keys(d.cuadres||{}).forEach(k=>store.putCuadre(k,d.cuadres[k]));}
      else{S.prod=d.prod||{};S.days=d.days||{};S.cuadres=d.cuadres||{};S.combos=d.combos||S.combos;S.recetas=d.recetas||S.recetas;S.provs=d.provs||S.provs;S.alias=d.alias||S.alias;saveLocal();}
      closeSheet();toast("Copia restaurada");render();};};
}
/* ---------- Eventos ---------- */
function bind(){
  const main=$("#main");
  main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.view=b.dataset.go;render();});
  if(S.view==="mover"){const M=S.mov;
    main.querySelectorAll("[data-tipo]").forEach(b=>b.onclick=()=>{M.t=b.dataset.tipo;render();});
    $("#mFiltro").oninput=e=>{M.filtro=e.target.value;$("#mProd").innerHTML=optionsFor(M.filtro);};
    $("#mProd").onchange=e=>{M.p=e.target.value;render();};
    $("#mQty").oninput=e=>{M.qty=e.target.value;};
    main.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const v=(Number(M.qty)||0)+Number(b.dataset.q);M.qty=M.t==="ajuste"?v:Math.max(0,v);$("#mQty").value=M.qty;});
    [["mLote","lote"],["mVence","vence"],["mCosto","costo"],["mNota","nota"],["mMotivo","motivo"]].forEach(([i,k])=>{const el=$("#"+i);if(el)el.oninput=el.onchange=e=>{M[k]=e.target.value;};});
    $("#mSave").onclick=()=>{const q=Number(M.qty);if(!M.p){toast("Elige un producto.");return;}if(!q||(M.t!=="ajuste"&&q<0)){toast("La cantidad debe ser mayor que cero.");return;}
      const mv={id:rid(),p:M.p,t:M.t,q,ts:Date.now()};if(M.t==="entrada"){if(M.lote)mv.lote=M.lote.trim();if(M.vence)mv.vence=M.vence;}if(M.t==="merma")mv.motivo=M.motivo;if(M.nota.trim())mv.nota=M.nota.trim();
      const d=today();const items=((S.days[d]||{}).items||[]).concat([mv]);saveDay(d,{items});
      if(M.t==="entrada"&&Number(M.costo)>0&&S.prod[M.p])store.putProd(M.p,Object.assign({},S.prod[M.p],{costo:Number(M.costo)}));
      toast(TIPOS[M.t]+" guardada: "+fmt(q)+" · "+prodName(M.p));Object.assign(M,{qty:1,lote:"",vence:"",costo:"",nota:""});render();};
    main.querySelectorAll("[data-delmov]").forEach(b=>b.onclick=()=>{if(b.dataset.armed){const d=today();saveDay(d,{items:((S.days[d]||{}).items||[]).filter(x=>x.id!==b.dataset.delmov)});toast("Movimiento borrado");}else{b.dataset.armed="1";b.textContent="¿Seguro?";b.style.color="var(--bad)";}});
  }
  if(S.view==="stock"){
    main.querySelectorAll("[data-smode]").forEach(b=>b.onclick=()=>{S.smode=b.dataset.smode;render();});
  }
  if(S.view==="stock"&&S.smode==="costos")bindCostos(main);
  if(S.view==="stock"&&S.smode==="pedido")bindPedido(main);
  if(S.view==="stock"&&S.smode!=="costos"&&S.smode!=="pedido"){
    $("#sQ").oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#sQ");n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}
    main.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;render();});
    main.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));
    $("#addP").onclick=()=>editProduct(null);
  }
  if(S.view==="cuadre"){
    main.querySelectorAll("[data-ccat]").forEach(b=>b.onclick=()=>{S.ccat=b.dataset.ccat;render();});
    main.querySelectorAll("[data-row]").forEach(row=>{const id=row.dataset.row;row.querySelectorAll("input[data-k]").forEach(inp=>inp.oninput=()=>{S.draft[id]=S.draft[id]||{};S.draft[id][inp.dataset.k]=inp.value;
      const {res}=computeAll();row.querySelector("[data-res]").innerHTML=resCells(id,res[id],S.draft[id]);
      const n=Object.keys(S.draft).filter(k=>S.draft[k].fisico!==undefined&&S.draft[k].fisico!=="").length;const b=$("#cSave");b.disabled=!n||!S.canWrite;b.textContent="Guardar cuadre ("+n+" productos)";});});
    $("#cImp").onclick=abrirImport;
    $("#cSave").onclick=()=>{const {res}=computeAll();const filas=[];
      Object.keys(S.draft).forEach(id=>{const d=S.draft[id],f=res[id];if(!f||d.fisico===undefined||d.fisico==="")return;const r=calcRow(f,d);
        filas.push({p:id,inicial:!f.counted,esperado:Math.round(f.stock*100)/100,fisico:r.fis,salio:r.salio,lventas:d.lventas===""||d.lventas===undefined?null:Number(d.lventas),lstock:d.lstock===""||d.lstock===undefined?null:Number(d.lstock),difV:r.difV,difS:r.difS,difApp:r.difApp});});
      if(!filas.length)return;const id="c"+Date.now();store.putCuadre(id,{ts:Date.now(),fecha:today(),nota:$("#cNota").value.trim(),filas});S.draft={};toast("Cuadre guardado: "+filas.length+" productos");render();};
    main.querySelectorAll("[data-cuadre]").forEach(b=>b.onclick=()=>showCuadre(b.dataset.cuadre));
  }
  if(S.view==="combos")bindCombos(main);
  if(S.view==="mas"){
    $("#bkExp").onclick=()=>saveFile("respaldo-inventario-capiro-"+today()+".json",JSON.stringify({app:"inventario-capiro",version:1,fecha:new Date().toISOString(),prod:S.prod,days:S.days,cuadres:S.cuadres,combos:S.combos,recetas:S.recetas,provs:S.provs,alias:S.alias}),"application/json");
    $("#bkImp").onclick=openRestore;
    $("#xStock").onclick=reporteStock;
    $("#xCombos").onclick=reporteFichas;
    $("#xCostos").onclick=reporteCostos;
    $("#xMov").onclick=reporteMovimientos;
  }
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;closeSheet();render();window.scrollTo(0,0);});
render();connect();
})();
</script>
